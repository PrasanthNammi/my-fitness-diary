<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -64 340 300" width="340" height="300" role="img" aria-label="MFD – My Fitness Diary – Lift · Eat · Track">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .tag { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 26px; fill: #3D4656; }
    .sub { font-family: 'Archivo', 'Arial Black', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 2.4px; fill: #3D4656; }
  </style>
  <!-- Calorie flame (behind the letters) -->
  <g transform="translate(166 50) scale(3.2) translate(-276 -73)">
    <path d="M276,40 C292,56 300,70 297,86 C294,99 286,106 276,106 C265,106 256,98 256,86 C256,75 262,68 266,60 C268,68 271,72 275,74 C278,63 279,52 276,40 Z" fill="#E8553A"/>
    <path d="M277,72 C285,80 289,88 287,95 C285,101 281,104 277,104 C272,104 267,100 267,94 C267,88 271,84 274,80 C275,84 276,86 278,87 C279,82 279,77 277,72 Z" fill="#F2A900"/>
  </g>
  <!-- M -->
  <polyline points="20,120 20,20 60,78 100,20 100,120" fill="none" stroke="#14213D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- F (integral-style) with dumbbell crossbar -->
  <path d="M200,26 C190,8 168,10 162,32 L150,108 C145,128 132,132 124,120" fill="none" stroke="#14213D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="26" r="12" fill="#14213D"/>
  <circle cx="124" cy="120" r="11" fill="#14213D"/>
  <line x1="134" y1="72" x2="202" y2="72" stroke="#14213D" stroke-width="10" stroke-linecap="round"/>
  <rect x="172" y="54" width="10" height="36" rx="3" fill="#14213D"/>
  <rect x="186" y="58" width="9" height="28" rx="3" fill="#14213D"/>
  <!-- D -->
  <path d="M240,20 L270,20 A50,50 0 0 1 270,120 L240,120 Z" fill="none" stroke="#14213D" stroke-width="22" stroke-linejoin="round"/>
  <!-- Tagline -->
  <line x1="52" y1="192" x2="80" y2="192" stroke="#14213D" stroke-width="2.5"/>
  <text class="tag" x="170" y="200" text-anchor="middle">My Fitness Diary</text>
  <line x1="260" y1="192" x2="288" y2="192" stroke="#14213D" stroke-width="2.5"/>
  <text class="sub" x="170" y="226" text-anchor="middle">LIFT · EAT · TRACK</text>
</svg>
