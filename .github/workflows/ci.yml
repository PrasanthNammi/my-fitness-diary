name: MFD code checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install client dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npx --yes pnpm@11.25.0 --dir hosting install --frozen-lockfile
      - name: Check TypeScript
        run: npx tsc -p frontend/tsconfig.json --noEmit
      # Some tests check the built service worker, so build first.
      - name: Build production bundle
        run: npm run build
      - name: Run regression tests
        run: |
          npm run test:performance
          node tests/nutrition-preferences.cjs
          node tests/workout-clock.cjs
          node tests/food-actions.cjs
          node tests/serving-weight.cjs
          node tests/progress-stats.cjs
          node tests/plates.cjs
          node tests/weekly-recap.cjs
          node tests/ai-suggestions.cjs
          node tests/chat-sync.cjs
          node tests/food-summary.cjs
          node tests/social-stats.cjs
          node tests/week-start.cjs
  database:
    # Postgres + PostgREST in Docker with Supabase stand-ins: every SQL test, the JavaScript/SQL
    # equivalence proof, the sync engine end to end, and a verified compaction rehearsal.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install client dependencies
        run: npm ci
      - name: Database and sync tests
        run: ./database/tests/run.sh
  connector:
    # The ChatGPT/Claude connector (hosting/independent, its SQL and Worker): typecheck, lint, the production and
    # staging artifact scans, and every connector test with the network disabled (embedded Postgres).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npx --yes pnpm@11.25.0 --dir hosting install --frozen-lockfile
      - name: Check TypeScript and lint
        run: |
          npx tsc -p hosting/tsconfig.json --noEmit --incremental false
          cd hosting && npx eslint independent worker/mcp.ts worker/mcp-consent.ts worker/auth-types.ts
      - name: Build the app and the connector artifacts
        # Some tests in the shared suite check the built app (service worker), so build it first.
        run: |
          npm run build
          node scripts-build-independent.cjs
      - name: Connector tests (network disabled)
        run: npm run test:local

