name: MFD code checks
on:
  pull_request:
  push:
    branches: [main, mfd-v53-code-only]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install client dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npx --yes pnpm@11.25.0 --dir hosting install --frozen-lockfile
      - name: Check TypeScript
        run: npx tsc -p frontend/tsconfig.json --noEmit
      # Some tests check the built service worker, so build first.
      - name: Build production bundle
        run: npm run build
      - name: Run regression tests
        run: |
          npm run test:performance
          node tests/nutrition-preferences.cjs
          node tests/workout-clock.cjs
          node tests/food-actions.cjs
          node tests/food-summary.cjs
  database:
    # Postgres + PostgREST in Docker with Supabase stand-ins: every SQL test, the JavaScript/SQL
    # equivalence proof, the sync engine end to end, and a verified compaction rehearsal.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install client dependencies
        run: npm ci
      - name: Database and sync tests
        run: ./database/tests/run.sh
