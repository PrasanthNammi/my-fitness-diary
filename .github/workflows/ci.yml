name: MFD code checks
on:
  pull_request:
  push:
    branches: [main, mfd-v53-code-only, staging/mfd-oauth-testing]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install client dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npx --yes pnpm@11.25.0 --dir hosting install --frozen-lockfile
      - name: Restore retained media
        run: |
          node scripts-restore-media.cjs
      - name: Check TypeScript
        run: |
          npx tsc -p frontend/tsconfig.json --noEmit
          npx tsc -p hosting/tsconfig.json --noEmit --incremental false
      - name: Lint Worker and hosting
        run: npm --prefix hosting run lint
      - name: Build and inspect staging artifacts
        run: npm run build
      - name: Run all local tests with network disabled
        run: npm run test:local
      - name: Check dependency security
        run: |
          npm audit --audit-level=high
          npx --yes pnpm@11.25.0 --dir hosting audit --audit-level=high
