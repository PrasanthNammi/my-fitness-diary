# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: .sites-runtime/pnpm-store
cacheDir: .sites-runtime/pnpm-store/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
# Security floors for transitive packages (each stays on its own major line).
overrides:
  miniflare>sharp: 0.35.5
  sharp@<0.35.5: 0.35.5
  '@babel/core@<7.29.6': 7.29.7
  baseline-browser-mapping@<2.11.0: 2.11.35
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2 <5.0.12: 5.0.12
  browserslist@<4.28.7: 4.29.5
  esbuild@<0.25.0: 0.25.12
  esbuild@>=0.28.0 <0.28.1: 0.28.2
  fast-uri@<3.1.9: 3.1.9
  fflate@<0.7.5: 0.7.5
  image-size@>=2 <2.0.3: 2.0.4
  js-yaml@>=4 <4.3.2: 4.3.2
  minimatch@>=7 <11.0.1: 11.0.4
  satori@<0.33.5: 0.33.5
  source-map-js@<1.2.2: 1.2.2
  undici@>=7 <7.30.1: 7.30.1
  ws@>=8 <8.21.0: 8.22.1
  zod@<4.6.6: 4.6.7
